[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for an AI-powered engineering portfolio: document ingestion, hybrid RAG retrieval, GitHub sync, citation validation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "fastembed>=0.4",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]
ocr = [
    "pytesseract>=0.3",
    "pdf2image>=1.17",
]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.54"]
voyage = ["voyageai>=0.3"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()-in-default-argument pattern is idiomatic, not a bug

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
