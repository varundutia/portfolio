services:
  - type: web
    name: portfolio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: portfolio-documents
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "512"
      - key: FRONTEND_ORIGIN
        value: https://varundutia.live
      - key: FRONTEND_ORIGINS
        sync: false
      - key: STORAGE_DIR
        value: /app/storage
